name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sobraboa
          POSTGRES_USER: sobraboa
          POSTGRES_PASSWORD: sobraboa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sobraboa -d sobraboa"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build e testes (PostgreSQL do service acima)
        run: mvn -B verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/sobraboa
      - name: Build da imagem Docker
        run: docker build -t sobraboa-api .