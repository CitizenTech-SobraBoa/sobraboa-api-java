# Sobe tudo:            docker compose up -d --build
# So a infraestrutura:  docker compose up -d postgres rabbitmq   (e rode a API pelo ./mvnw)
# Variaveis em um arquivo .env (copie de .env.example). NAO commite o .env.
# Os valores padrao abaixo servem so para demonstracao local: para publicar, defina JWT_SECRET e ADMIN_SENHA no .env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sobraboa
      POSTGRES_USER: sobraboa
      POSTGRES_PASSWORD: sobraboa
    ports: ["5433:5432"]
    volumes: [sobraboa-pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sobraboa -d sobraboa"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"   # painel: http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: prod,demo        # demo = carrega dados de demonstracao
      DB_URL: jdbc:postgresql://postgres:5432/sobraboa
      DB_USER: sobraboa
      DB_PASSWORD: sobraboa
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-segredo-local-de-demonstracao-troque-no-env-min-32}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sobraboa.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-Admin@12345}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sem-chave-configurada}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      SWAGGER_ENABLED: "true"

volumes:
  sobraboa-pgdata: