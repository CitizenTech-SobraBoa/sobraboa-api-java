# ===================================
# Perfil DEV - uso local
# ===================================
# Sobe com:  ./mvnw spring-boot:run        (dev e o perfil padrao)
# Requer o PostgreSQL e o RabbitMQ do docker-compose:  docker compose up -d postgres rabbitmq

spring.datasource.url=jdbc:postgresql://localhost:5433/sobraboa
spring.datasource.username=sobraboa
spring.datasource.password=sobraboa

# Segredo JWT apenas para desenvolvimento local (NUNCA usar em producao).
# Minimo 32 bytes, senao a API recusa subir.
app.jwt.secret=${JWT_SECRET:sobraboa-dev-secret-troque-em-producao-min-32-bytes}

# Admin criado na subida (AdminSeeder) - valores de DEV
app.admin.email=${ADMIN_EMAIL:admin@sobraboa.com}
app.admin.senha=${ADMIN_SENHA:Admin@12345}

# Em dev aceita qualquer origem (app Mobile roda em enderecos variaveis)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Dados de demonstracao: DemoDataInitializer roda nos perfis "dev" e "demo"
logging.level.br.com.fiap.sobraboaapi=DEBUG