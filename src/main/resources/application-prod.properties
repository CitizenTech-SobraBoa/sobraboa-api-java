# ===================================
# Perfil PROD
# ===================================
# Nenhum valor sensivel tem default: se a variavel nao existir, a aplicacao
# NAO sobe (fail-fast) em vez de rodar com segredo fraco.
# Ative com SPRING_PROFILES_ACTIVE=prod (ou prod,demo para carregar dados de demonstracao).

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Sem segredo, credencial de admin ou origem padrao em producao
app.jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL}
app.admin.senha=${ADMIN_SENHA}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Swagger desligado por padrao em prod (ligue com SWAGGER_ENABLED=true se precisar)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}