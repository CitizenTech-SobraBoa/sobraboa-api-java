# ===================================
# SobraBoa API - configuracoes COMUNS a todos os perfis
# ===================================
# O que muda por ambiente (banco, segredos, CORS, Swagger) fica em:
#   application-dev.properties   -> uso local, dados de demonstracao, segredos de DEV
#   application-prod.properties  -> sem nenhum segredo com valor padrao (fail-fast)
#   (testes: src/test/resources/application-test.properties)
# Salve este arquivo em UTF-8.

spring.application.name=sobraboa-api
server.port=${PORT:8080}

# Perfil padrao: "dev" (conveniencia local). Em qualquer ambiente real
# defina SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# ---------- JPA / Hibernate ----------
# O schema e 100% gerenciado pelo Flyway. "none" porque o DDL usa ENUM nativo
# do PostgreSQL, que a validacao do Hibernate nao reconhece bem.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- DataSource (PostgreSQL) ----------
spring.datasource.driver-class-name=org.postgresql.Driver
# Deixa o PostgreSQL converter String -> ENUM nativo (papel_usuario, status_doacao...)
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ---------- RabbitMQ (eventos de doacao/reserva) ----------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ---------- Spring AI (Assistente de Doacao) ----------
# Sem chave a API sobe normalmente; so o endpoint /api/doacoes/assistente
# responde 503 ("assistente indisponivel").
spring.ai.openai.api-key=${OPENAI_API_KEY:sem-chave-configurada}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

# ---------- Regras da aplicacao ----------
# (o segredo JWT e as credenciais do admin sao definidos por perfil)
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.reserva.minutos-para-retirar=${RESERVA_MINUTOS:120}

# ---------- Actuator (healthcheck para Docker/Render) ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---------- Swagger / OpenAPI (http://localhost:8080/swagger-ui.html) ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ---------- Cache Caffeine (OPCIONAL: so se adicionar spring-boot-starter-cache) ----------
# spring.cache.type=caffeine
# spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# ---------- Logging ----------
logging.level.br.com.fiap.sobraboaapi=INFO