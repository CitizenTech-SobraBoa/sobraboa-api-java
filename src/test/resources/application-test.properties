# Perfil de teste.
# Os testes usam um PostgreSQL REAL (o mesmo do docker-compose: docker compose up -d postgres).
# No GitHub Actions ele sobe como "service" (ver ci.yml). Nada de H2: o DDL usa ENUM nativo.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/sobraboa}
spring.datasource.username=${TEST_DB_USER:sobraboa}
spring.datasource.password=${TEST_DB_PASSWORD:sobraboa}

spring.flyway.enabled=true

app.jwt.secret=test-secret-key-not-for-production-use-only-min-32-bytes
app.jwt.expiration-minutes=60
app.admin.email=admin@teste.com
app.admin.senha=Admin@12345
app.cors.allowed-origins=*

# Sem RabbitMQ real nos testes: o listener nao inicia (os testes usam @MockitoBean RabbitTemplate)
spring.rabbitmq.listener.simple.auto-startup=false

# Chave falsa so para o contexto subir; os testes nao chamam a OpenAI
spring.ai.openai.api-key=chave-de-teste